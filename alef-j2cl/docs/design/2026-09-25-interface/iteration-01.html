pan><span class="lock" style="color:${lost||bad?'var(--amber)':state==='saved'?'var(--muted)':'var(--green)'}">${I(draft?'lock':'unlock')}${draft?'Locked by you · this tab':lost?'Lock expired':bad?'Connection interrupted':'Read only'}</span><span class="grow"></span><span class="save-status muted" style="font-size:11px">${draft||lost?'Unsaved changes':'All changes saved'}</span><div class="flex undo-tools">${B('','undo','icon ghost','undo')}${B('','redo','icon ghost','redo')}</div>${B(draft?'Save':lost?'Resume draft':bad?'Reconnect':'Lock root',draft?'save':lost?'resume':bad?'reconnect':'lock','primary',draft?'check':'lock')}<div class="menu-wrap">${B('','more','icon ghost','more')}<div class="menu hidden" id="more-menu">${['Release lock','Lock model','Move root','Move content','Delete root','Reload workspace','Resume draft'].map(n=>B(n,'menu-action')).join('')}</div></div></div>${lost?`<div class="inline-alert">${I('circle')}Your local draft is preserved. Reacquire the lock and compare with the latest saved version.</div>`:bad?`<div class="inline-alert red">${I('circle')}Updates are paused. Your draft is kept locally; reconnect before saving.</div>`:''}<div class="editor-columns" id="editor-columns"><div class="editing-center"><div class="canvas-area"><div class="native-window"><img class="native-surface" src="current-interface-desktop.jpg" alt="Unmodified capture of the existing ALEF generated ObjectModel editor"></div><span class="canvas-caption">Existing generated editor · captured from the running application</span></div><section class="diagnostics" id="diagnostics"><div class="diag-tabs"><span class="current">Diagnostics <span class="count">2</span></span><span class="muted">0 errors · 0 warnings</span><span class="grow"></span>${B('','toggle-diagnostics','icon ghost','down')}</div><div class="diag-row">${I('circle')}Numeriek maps to decimal<span class="grow"></span><span class="muted">Information</span></div><div class="diag-row">${I('circle')}Tekst maps to string<span class="grow"></span><span class="muted">Information</span></div></section></div><aside class="inspector" id="inspector"><div class="panel-title">Inspector${B('','toggle-inspector','icon ghost','panel')}</div><div class="inspector-content"><div class="upper">Selected node</div><h3 style="margin-top:9px">ObjectModel</h3><div class="muted" style="font-size:11px;overflow-wrap:anywhere">${rootName}</div><div class="fields"><div class="field"><label>Model</label><div>servicetest.choice</div></div><div class="field"><label>Language</label><div>Gegevensspraak</div></div></div><div class="upper">Generated inspector</div><div class="native-inspector"><img src="current-interface-desktop.jpg" alt="Actual generated metatags inspector"></div><p class="hint">Language-specific controls stay in the generated inspector.</p><div class="shortcuts"><div class="upper">Editor shortcuts</div><div class="shortcut">Intentions & quick fixes<kbd>Alt ↵</kbd></div><div class="shortcut">Go to reference<kbd>Ctrl + click</kbd></div><div class="shortcut">Undo<kbd>Ctrl Z</kbd></div></div><div style="margin-top:30px;padding-top:15px;border-top:1px solid var(--line)"><div class="upper">Access</div><p class="hint">${draft?'Exclusive editing in this tab. Other authorized users can still read this root.':'An exclusive root lock is required to edit.'}</p></div></div></aside></div></div></section>`}

function releases(){return `<section class="page"><div class="breadcrumbs"><span>Releases</span>${I('chevron')}<span>Review candidate</span></div><div class="page-heading"><div class="grow"><h1>Gegevensmodel update</h1><p>Fixed workspace revision · submitted by author Local · 25 September 2026</p></div><span class="pill warn">${I('clock')}Awaiting approval</span>${B('All releases','release-list','small')}</div><div class="summary-strip"><div><div class="upper">Source revision</div><div class="value mono">4ae7b2c · master</div></div><div><div class="upper">Comparison baseline</div><div class="value mono">Approved · 73fd446</div></div><div><div class="upper">Package scope</div><div class="value">Complete workspace + dependencies</div><div class="mono muted" style="font-size:10px;margin-top:4px">sha256:9c1f72b4…6f08 · illustrative</div></div></div><div class="review-layout"><div class="stack"><article class="card"><div class="card-head">Review changes<span class="grow"></span><span class="pill neutral">3 model changes</span></div><div class="subnav"><button class="active" data-action="review-tab" data-tab="model">Model changes</button><button data-action="review-tab" data-tab="resources">Resources <span class="count">2</span></button><button data-action="review-tab" data-tab="validation">Validation</button><button data-action="review-tab" data-tab="manifest">Manifest</button></div><div id="review-content">${modelDiff()}</div><div class="evidence"><span class="flex">${I('check')}Native validation passed</span><span class="flex">${I('check')}1 Testspraak test passed</span><span class="flex">${I('circle')}2 informational diagnostics</span></div></article><article class="card"><div class="card-body flex"><div class="grow"><div class="upper">Immutable package</div><div class="mono" style="margin:7px 0">sha256: 9c1f72b4…6f08 <span class="muted">· illustrative digest</span></div><span class="hint">Approval binds these exact bytes. Later edits create a new candidate.</span></div>${B('Package','download','small','download')}</div></article></div><aside class="review-side stack"><article class="card"><div class="card-head">Review decision<span class="grow"></span><span class="pill neutral">0 / 1</span></div><div class="card-body"><h3>Independent approval required</h3><p>You are reviewing as <strong>reviewer Local</strong>.</p><div class="check-line">${I('check')}Access to every root in this package</div><div class="check-line">${I('check')}Not a submitter or contributor</div><div class="check-line">${I('check')}Validation evidence is complete</div><label for="reason" class="hint" style="display:block;margin:20px 0 6px">Decision reason</label><textarea id="reason" placeholder="Explain your review decision…"></textarea>${B('Approve exact package','approve','primary','check')}<div class="side-actions">${B('Request changes','request-changes','ghost')}${B('Reject','reject','ghost')}</div><div class="tiny-note">Only authorized, independent reviewers can approve.</div></div></article><article class="card"><div class="card-head">Activity</div><div class="card-body timeline"><div class="timeline-row"><strong>Ready for review</strong><small>Package sealed · 10:42</small></div><div class="timeline-row"><strong>Validation passed</strong><small>Native MPS + Testspraak · 10:41</small></div><div class="timeline-row"><strong>Revision submitted</strong><small>author Local · 10:40</small></div></div></article></aside></div></section>`}
function modelDiff(){return `<div class="model-diff-header"><span class="type-icon">O</span><strong>Gegevensmodel</strong><span class="muted">/ de naam / de voornaam</span><span class="grow"></span><span class="pill neutral">Modified</span></div><div class="diff-grid"><div class="diff-col"><div class="diff-title"><span>Baseline</span><code>73fd446</code></div><div class="diff-code"><div class="code-line"><span class="keyword">Objecttype</span> de naam</div><div class="code-line">  de bijnaam   Tekst;</div><div class="code-line">  de initialen Tekst;</div><div class="code-line remove">− de voornaam  Tekst;</div></div></div><div class="diff-col"><div class="diff-title"><span>Candidate</span><code>4ae7b2c</code></div><div class="diff-code"><div class="code-line"><span class="keyword">Objecttype</span> de naam</div><div class="code-line">  de bijnaam   Tekst;</div><div class="code-line">  de initialen Tekst;</div><div class="code-line add">+ de roepnaam  Tekst;</div></div></div></div><div class="model-change">${I('chevron')}<span class="type-icon">S</span><span>serviceapartmodel</span><span class="muted">Reference updated</span><span class="grow"></span><span class="pill neutral">Modified</span></div><div class="model-change">${I('chevron')}<span class="type-icon">T</span><span>ServiceTest</span><span class="muted">Expected value updated</span><span class="grow"></span><span class="pill neutral">Modified</span></div>`}

function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));document.querySelector('#screen').innerHTML=currentPage==='model'?model():currentPage==='releases'?releases():deployments();document.querySelector('#identity-label').textContent=currentPage==='model'?'author Local':currentPage==='releases'?'reviewer Local':'administrator Local';document.querySelector('#avatar').textContent=currentPage==='model'?'AL':currentPage==='releases'?'RL':'AD';document.querySelector('#state-preview').disabled=currentPage!=='model';document.querySelector('#footer-state').textContent=state==='loading'&&currentPage==='model'?'Initializing authorized models':'All authorized models loaded';labelIcons();}

document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){currentPage=page.dataset.page;location.hash=currentPage;render();return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='toggle-tree'){if(innerWidth<=800)document.querySelector('#project').classList.toggle('drawer-open');else document.querySelector('#workbench').classList.toggle('no-tree')}else if(a==='toggle-inspector'){if(innerWidth<=1180)document.querySelector('#inspector').classList.toggle('drawer-open');else document.querySelector('#editor-columns').classList.toggle('no-inspector')}else if(a==='toggle-diagnostics')document.querySelector('#diagnostics').classList.toggle('closed');else if(a==='more')document.querySelector('#more-menu').classList.toggle('hidden');else if(a==='save'){state='saved';document.querySelector('#state-preview').value=state;render();toast('Design preview: saved state shown. Nothing was sent to the application.')}else if(a==='lock'||a==='resume'||a==='reconnect'){state='draft';document.querySelector('#state-preview').value=state;render();toast('Design preview: this-tab editing state. No real lock was acquired.')}else if(a==='cancel-load'){state='saved';document.querySelector('#state-preview').value=state;render();toast('Loading preview cancelled. Use Preview → Loading to try again.')}else if(a==='review-tab'){document.querySelectorAll('.subnav button').forEach(x=>x.classList.toggle('active',x===b));const contents={model:modelDiff(),resources:'<div class="card-body stack"><strong>Files and logical resources</strong><div class="flex"><span class="pill neutral">Modified</span><code>models/gegevens.mps</code></div><div class="flex"><span class="pill neutral">Modified</span><code>models/services.mps</code></div><p class="hint">Illustrative paths. The implemented API supplies before/after resource contents; the new layout groups them by model.</p></div>',validation:'<div class="card-body stack"><span class="pill">Native MPS validation passed</span><p>0 errors · 0 warnings · 2 informational diagnostics</p><p>Numeriek maps to decimal.<br>Tekst maps to string.</p><span class="pill">ServiceTest · passed</span><p class="hint">Persisted source unchanged. Values shown are illustrative, using the evidence fields already exposed by the application.</p></div>',manifest:'<div class="card-body stack"><strong>Complete immutable source package</strong><code>Source: 4ae7b2c (illustrative)<br>Baseline: 73fd446<br>Native runtime: pinned MPS / ALEF<br>Checksum: sha256:9c1f72b4…6f08 (illustrative)</code><p class="hint">Inspect the complete manifest, dependencies, contributors and full digest before approval.</p></div>'};document.querySelector('#review-content').innerHTML=contents[b.dataset.tab]}else if(a==='close-modal')document.querySelector('#modal-host').innerHTML='';else if(a==='promote')modal('Promote to production · simulation',`<span class="pill warn">SIMULATED DELIVERY</span><p>Gegevensmodel update · sha256:9c1f72b4…6f08</p><div class="check-line">${I('check')}Same immutable package that succeeded on test</div><div class="check-line">${I('lock')}Independent environment approval required</div><p>Authorization, approval, target version and current installed package are checked again at dispatch.</p><p class="hint">Design preview only. This action creates no deployment.</p>`,'Close preview');else if(a==='configure')modal('Platform configuration · simulation','<label>Platform enabled</label><select><option>Enabled</option><option>Disabled</option></select><label>Environment approval</label><select><option>Require independent approval</option><option>No additional environment gate</option></select><label>Simulation outcome</label><select><option>Successful delivery</option><option>Failure before acceptance</option><option>Failure after acceptance</option><option>Timeout after acceptance</option></select><p>Configuration changes create a new version. This prototype does not save settings.</p>');else if(a==='inspect-delivery'||a==='reconcile')modal('Deployment details · simulation',`<span class="pill warn">SIMULATED</span><p>${a==='reconcile'?'Look up the original accepted operation before deciding whether a retry is needed.':'Delivering the retained approved package to the durable stub.'}</p><div class="progress-track"><span style="width:65%"></span></div><div class="flex"><span class="hint">Verifying package checksums</span><span class="grow"></span><span class="hint">65%</span></div><p>No ALEF service is executed.</p>${B('Cancel simulated deployment','close-modal','small')}`);else if(a==='approve'||a==='request-changes'||a==='reject')toast('Design preview only. No review decision was submitted.');else if(a==='new-root')modal('Create a root','<label>Model</label><select><option>servicetest.choice</option></select><label>Root type</label><select><option>ObjectModel</option><option>Regelgroep</option><option>Service</option><option>ServiceTestSet</option></select><p>The implementation acquires the required model and root scopes. This preview creates no model content.</p>');else if(a==='rollback')modal('Governed rollback','<p>Select a previously delivered, retained and still-approved package. The environment gates still apply.</p><span class="pill warn">SIMULATED</span><p>Rollback creates a separate delivery record. The release approval itself does not change.</p>');else if(a==='release-list')modal('Workspace releases',`<p>Review immutable candidates and their preparation jobs.</p><div class="check-line"><span class="pill warn">Awaiting approval</span>Gegevensmodel update</div><div class="check-line"><span class="pill">Approved</span>Previous release</div>${B('Submit current revision','submit-preview','small')}`);else if(a==='submit-preview')modal('Submit a committed revision','<label>Release title</label><input placeholder="Describe this release"><p>Complete workspace at a fixed saved revision. Unsaved local edits are excluded. Validation runs before an independent reviewer can approve.</p>');else toast('Design preview: this control maps to an existing workflow. No application data was changed.');});
